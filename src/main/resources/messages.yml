# {%username%} - the name of the user who joined

# <c > - specifying the color
# <c0> - black
# <c1> - dark blue
# <c2> - dark green
# <c3> - dark aqua
# <c4> - dark red
# <c5> - dark purple
# <c6> - gold
# <c7> - gray
# <c8> - dark gray
# <c9> - blue
# <ca> - green
# <cb> - aqua
# <cc> - red
# <cd> - light purple
# <ce> - yellow
# <cf> - white

# <# > - specifying the color by hex format
# Example: <#ffffff> - white

# plugin messages
welcome: "Welcome, {%username%} to the server!"

login:
  logged_in: "<c2>Successful login!"
  log_in: "<cc>Login via discord!"

remove_user:
  user_removed: "<ce>{%username%}<cf> was <c4>removed<cf>!"

error:
  logged_in: "<c4>You are already logged in!"
  not_logged_in: "<c4>You are not logged in!"
  not_authorized: "<c4> You are not registered!"
  arguments: "<c4>You forgot arguments!"
  user_not_exist: "<c4>The user by name <ce>{%username%}<c4> does not exist."
  permissions: "<c4>You don't have permissions!"
  timeout: "<c4>Time out!"

# bot messages
bot:
  verification_successful: "Your account has been successfully verified."
  deletion_successful: "The account has been successfully deleted."
  authorization: "Please confirm the login to your {%username%} account."
  login: "You have successfully logged in."
  help: |
    Available commands:
    1) !add <username> — Create a new account
    2) !delete <username> — Delete an existing account
    3) !help — Show this help message

bot_error:
  user_exists: "This account already exists."
  enough_accounts: "You have reached the maximum number of accounts."
  name_no_set: "You must specify a name. Example: !verify Bob"
  login: "Login failed. Please try again."
  account_deletion_is_not_allowed: "Account deletion is disabled by the administrator."
  account_owner: "You are not the owner of this account."
  account_not_exits: "This account does not exist."
  not_expected_error: "An unexpected error occurred. Please try again later."
